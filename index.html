<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armory</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/2348052fee.js" crossorigin="anonymous"></script>
  <script src="index.js" defer></script>
</head>
<body>
  <section id="landing">
    <nav>
      <div class="container nav__container">
        <div class="row">
          <div class="nav__logo">
            <i class="fa-solid fa-landmark"></i>
            <div class="nav__logo--title">
            AIC Armory
          </div>
          <div class="nav__links">
            <ul>
              <li>
                <a href="#" class="nav__link link__hover-effect">Home</a>
              </li>
              <li>
                <a href="#" class="nav__link link__hover-effect">About</a>
              </li>
              <li>
                <a href="#" class="nav__link--primary">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <header>
      <div class="container">
        <div class="row header__row">
          <h1 class="header__description">
            Database of Arms and Armor at the <span class="teal">Art Institute of Chicago</span>
          </h1>
          <div class="search-container">
            <input type="text" id="searchInput" placeholder="ex: burgonet">
            <button id="searchButton" class="search-button">Search</button>
          </div>
        </div>
      </div>
    </header>
    
    <div id="resultsContainer">
      <div class="armor-container">
        <img src="" alt="" class="armor-image">
        <h3 class="armor-title"></h3>
        <h4 class="artist-name"></h4>
        <p class="date-made"></p>
      </div>
    </div>
  </section>
</body>
</html>
