<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armory</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/2348052fee.js" crossorigin="anonymous"></script>
  <script src="index.js"></script>
</head>
<body>
  <section id="landing">
    <nav>
      <div class="container nav__container">
        <div class="row">
        <div class="nav__logo">
          <i class="fa-solid fa-landmark"></i>
          <div class="nav__logo--title">
            AIC Armory
          </div>
        </div>
      </div>
      <div class="nav__links">
        <ul>
          <li>
            <a href="#" class="nav__link">Home</a>
          </li>
          <li>
            <a href="#" class="nav__link">Find Armor</a>
          </li>
          <li>
            <a href="#" class="nav__link nav__link--primary">Contact</a>
          </li>
        </ul>
      </div>
      </div>
    </nav>
    <header>
      <div class="container">
        <div class="row header__row">
          <h1 class="header__description">
            Database of Arms and Armor at the <span class="teal">Art Institute of Chicago</span>
          </h1>
          <div class="header__search">
            <input type="text" class="header__search--input" placeholder="ex: burgonet">
            <button class="header__search--btn">Search</button>
          </div>
        </div>
      </div>
    </header>
  </section>
</body>
</html>
