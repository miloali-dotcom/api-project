<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIC Armory</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/2348052fee.js" crossorigin="anonymous"></script>
  <script type="module" src="index.js" defer></script>
</head>
<body>
  <section id="landing">
    <nav>
      <div class="nav__container">
        <div class="row">
          <div class="nav__logo">
            <i class="fa-solid fa-landmark"></i>
            <div class="nav__logo--title">
            AIC Armory</div>
          </div>
          <div class="nav__links">
            <ul>
              <li>
                <a href="#" class="nav__link">Home</a>
              </li>
              <li>
                <a href="#" class="nav__link">About</a>
              </li>
              <li>
                <a href="#" class="nav__link--primary">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <header>
      <div class="container">
        <div class="row header__row">
          <h1 class="header__description">
            Database of Arms and Armor at the <span class="teal">Art Institute of Chicago</span>
          </h1>
          <div class="search-container">
            <input type="text" id="searchInput" placeholder="ex: gauntlet">
            <button id="searchButton" class="search-button">Search</button>
          </div>
        </div>
      </div>
      <div class="filter-container">
        <label for="viewFilter">Filter by View</label>
        <select id="viewFilter">
          <option value="all">All Armor</option>
          <option value="onView">On View</option>
          <option value="offView">Off View</option>
        </select>
      </div>
    </header>
    
    <div id="resultsContainer">
      <div class="armor-container">
        <img src="" alt="" class="armor-image">
        <h3 class="armor-title"></h3>
        <h4 class="artist-name"></h4>
        <p class="date-made"></p>
      </div>
    </div>
  </section>
  <footer>
    <div class="container">
      <div class="row footer__row">
        <div class="footer__logo">
          <i class="fa-solid fa-landmark"></i>
          <div class="footer__title">AIC Armory</div>
        </div>
        <div class="footer__copyright">© Milo Ali 2026</div>
      </div>
    </div>
  </footer>
</body>
</html>
